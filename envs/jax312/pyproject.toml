[project]
name = "escd-side-jax312"
version = "0.1.0"
description = "Side environment for workers/dibs.py (DiBS, dibs-lib 1.3.3), workers/cdfm.py (CDFM, cdfm-base 0.1.0) and workers/arrow.py (Arrow, arrowfm 0.1.0). CPU only."
requires-python = "==3.12.*"
dependencies = [
    "dibs-lib==1.3.3",      # Lorch et al. NeurIPS 2021, arXiv 2105.11839 (JAX)
    "cdfm-base==0.1.0",     # Qiao et al. 2026, arXiv 2607.11508 (PyTorch)
    "arrowfm @ git+https://github.com/ryan-thompson/arrowfm@8487278a372f81699752e0d0e24a947f06c7d5ee",  # Thompson et al. 2026, arXiv 2605.07204 (PyTorch)
]

[tool.uv]
package = false
# dibs-lib declares jupyter (notebook-only, never imported by the library); dropped with a never-true marker.
override-dependencies = [
    "jupyter; sys_platform == 'never'",
]
