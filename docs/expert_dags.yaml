- name: v2_pathophysiology
  description: 'V1 plus the body-first / brain-first hypothesis (Borghammer & Van Den Berge 2019; Horsager 2020): RBD, autonomic dysfunction and depression share a stable latent non-motor trait rather than
    causing each other; the trait and baseline DaT drive progression and cognitive decline. Orthostatic BP drop arises from autonomic failure. RBD -> DaT is deliberately absent (Horsager 2020: equal putaminal
    loss). The latent node is tested through its implied independences among its children.

    '
