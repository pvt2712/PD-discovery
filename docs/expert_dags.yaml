- name: v1_guideline_minimal
  description: 'Only edges with GUIDELINE or STRONG support. Treatment decisions follow NICE NG71 / AAN 2021 / MDS 2018: dose escalates on motor severity, ADL impact and complications; agonists are avoided
    with older age, cognitive impairment, sleepiness and impulse-control symptoms. No pathophysiology beyond the motor chain; non-motor symptoms are left unconnected except for known drug effects.

    '
  edges:
