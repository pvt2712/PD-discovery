- name: v3_nonmotor_disability
  description: 'V1 plus the clinical argument that non-motor symptoms drive disability beyond motor severity: depression, cognition and autonomic dysfunction have direct lagged effects on ADL and independence
    (Schrag 2000; Weintraub 2004; Merola 2018; Longardner 2022); mood raises the risk of impulse-control disorders (Marin-Lahoz 2019); ADL impairment feeds back on mood and daytime sleepiness (ParkWest
    reverse direction). No latent trait: non-motor symptoms are linked by directed edges where cohort evidence exists, otherwise left unconnected.

    '
