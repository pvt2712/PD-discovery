- name: v4_guideline_treatment
  node_set: extended
  description: 'Core progression DAG recommended in docs/expert_dag_evidence.md: v2''s latent non-motor trait backbone, with (i) motor complications split into wearing-off (fluct) and dyskinesia (dysk),
    which have different causes and treatments; (ii) MAO-B inhibitors and amantadine as separate treatment classes beside levodopa and agonists (COMT, 87 exposed, and anticholinergics, 8, are too sparse);
    (iii) hallucinations, anxiety, axial impairment and BMI as nodes, because they are treatment contraindications, dyskinesia risk factors or drivers of function that the guidelines name explicitly. Treatment
    *actions* (initiate/add/switch) and 3-monthly treatment grids are left to the target-trial analyses (Paper 3), as the review''s §7 recommends.

    '
