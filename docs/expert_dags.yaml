- name: v41_progression
  node_set: v41
  description: 'v4 revised per the review in expert_dag_results.md section 8. Construct fixes: (1) motor_na = UPDRS III minus the axial items, removing the part-whole overlap between motor and axial; (2)
    STAI split into baseline trait anxiety (anx_trait0) and time-varying state anxiety (anx_state); (3) a core impulse-control outcome (gambling, sexual, buying) with compulsive eating excluded, removing
    overlap with BMI; (4) baseline BMI (bmi0) as the dyskinesia risk factor instead of same-visit BMI; (5) treatment history: months since levodopa start (t_ldopa) and cumulative levodopa (cum_ldopa) as
    shared causes of wearing-off and dyskinesia, instead of an arbitrary fluct<->dysk direction; (6) the latent non-motor trait now has baseline DaT binding as an indicator (trait -> dat0), so the repeated
    DaT-autonomic dependence is explained by the trait rather than by a direct DaT arrow. Restored lagged disability-feedback edges from v3 (depression/autonomic -> ADL; ADL -> mood, sleepiness). Deliberately
    NOT added, per the review: DaT -> autonomic, DaT -> OH, fluct <-> dysk, and symptom -> dose arrows for every rejected independence. trait -> hallucinations is kept but marked EXPLORATORY.

